[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wavetank"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "jax[cpu]>=0.4.25",
    "optax>=0.2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "jaxopt>=0.8.5",
    "equinox>=0.11",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.4.25"]
dev = ["pytest>=8.0", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wavetank*"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.0",
]
