<!DOCTYPE html>
<html><head>
  <meta charset="utf8">
  <title>WebGL Water</title>
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
  <!-- Aggressive cache-busting: Python's http.server doesn't send no-cache,
       so without this the browser will happily serve stale JS after edits. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>var _cb = Date.now();</script>
  <script src="OES_texture_float_linear-polyfill.js"></script>
  <script src="lightgl.js"></script>
  <script src="cubemap.js"></script>
  <script>document.write('<script src="renderer.js?cb=' + _cb + '"><\/script>');</script>
  <script>document.write('<script src="water.js?cb=' + _cb + '"><\/script>');</script>
  <script>document.write('<script src="main.js?cb=' + _cb + '"><\/script>');</script>
  <style type="text/css">
    body { font: 13px/140% Arial, sans-serif; background: black; color: white; overflow: hidden; margin: 0; }
    a { color: inherit; cursor: pointer; }
    img { display: none; }
    canvas { position: absolute; top: 0; left: 0; }
    #loading { position: absolute; left: 0; top: 50%; right: 0; text-align: center; margin-top: -8px; z-index: 10; }

    /* Collapsible panels (HTML5 <details>) */
    details.panel {
      position: absolute;
      background: rgba(0,0,0,0.7);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12px;
      line-height: 18px;
      z-index: 10;
    }
    details.panel > summary {
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      list-style: none;
    }
    details.panel > summary::-webkit-details-marker { display: none; }
    details.panel > summary::before {
      content: '▼ ';
      display: inline-block;
      transition: transform 0.15s;
    }
    details.panel:not([open]) > summary::before {
      transform: rotate(-90deg);
    }
    details.panel[open] > summary { margin-bottom: 8px; }

    #controls { left: 20px; bottom: 20px; max-width: 600px; }
    #controls input[type=range] { width: 200px; vertical-align: middle; }
    #controls .val { display: inline-block; min-width: 40px; text-align: right; font-family: monospace; }

    /* Top-down caustic preview pane */
    #causticView { right: 20px; top: 20px; }
    #causticPreview {
      display: block;
      background: black;
      border: 1px solid rgba(255,255,255,0.2);
      image-rendering: pixelated;
    }
  </style>
</head><body>
  <div id="loading">Loading...</div>

  <details class="panel" id="controls" open>
    <summary>Controls</summary>
    <div>
      <label>Animation file: <input id="animFile" type="file" accept=".bin"></label>
      <span id="animLabel" style="margin-left:10px; opacity:0.8;">(none loaded)</span>
    </div>
    <div style="margin-top:8px;">
      Water depth (tank-widths): <input id="poolHeight" type="range" min="0.0" max="10.0" step="0.05" value="1.0">
      <span class="val" id="poolHeightVal">1.00</span>
    </div>
    <div style="margin-top:4px;">
      Height scale: <input id="heightScale" type="range" min="0.0" max="10.0" step="0.05" value="1.0">
      <span class="val" id="heightScaleVal">1.00</span>
    </div>
    <div style="margin-top:8px;" id="timeRow">
      <button id="playPauseBtn" type="button" style="width:60px;">Pause</button>
      Time: <input id="timeScrub" type="range" min="0" max="1" step="0.001" value="0" style="width:300px;">
      <span class="val" id="timeLabel">t = 0.00 / 0.00 s</span>
    </div>
    <small>Camera: drag to orbit. L key: align light to camera. Space: pause.</small>
  </details>

  <details class="panel" id="causticView" open>
    <summary>Caustic (top-down)</summary>
    <canvas id="causticPreview" width="320" height="320"></canvas>
  </details>

  <img id="tiles" src="tiles.jpg">
  <img id="xneg" src="xneg.jpg">
  <img id="xpos" src="xpos.jpg">
  <img id="ypos" src="ypos.jpg">
  <img id="zneg" src="zneg.jpg">
  <img id="zpos" src="zpos.jpg">
</body></html>
